# Master-node frontend stack (HTTP-only). Reads findings from ci-utils via nginx
# proxy to the host NodePort. Started by master-node.sh.
services:
  frontend:
    image: tejbruhath/sast-frontend:latest
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend.nginx.conf:/etc/nginx/conf.d/default.conf:ro
