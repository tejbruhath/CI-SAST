# Master-node frontend nginx (HTTP-only). Serves the React SPA and proxies the
# findings API to ci-utils' NodePort (30084) on the host. No TLS (no domain).
server {
    listen 80;
    server_name _;

    # Findings API -> ci-utils (listing + raw artifacts). Same-origin to the browser.
    location /artifacts/ {
        proxy_pass http://host.docker.internal:30084/artifacts/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React SPA
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
