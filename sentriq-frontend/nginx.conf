server {
    listen 80; # HTTP only (TLS terminates elsewhere if any)
    server_name _; # accept any Host header
    root /usr/share/nginx/html; # Vite build output
    index index.html; # default document

    # SPA: serve index.html for any non-file route.
    location / {
        try_files $uri $uri/ /index.html; # client-side routing fallback
    }

    # Proxy API calls to the Django backend (single-origin for the browser).
    location /api/ {
        proxy_pass http://backend:8080; # docker-compose service name
        proxy_set_header Host $host; # preserve original Host
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # client IP chain
        proxy_read_timeout 120s; # long enough for scan create / slow endpoints
    }
}
